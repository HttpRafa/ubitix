name: Update DNS records [TEST]

on:
  workflow_dispatch:
    inputs:
      prefix:
        type: string
        description: "IPv6 Prefix"
        required: true
      mapping:
        type: string
        description: "IPv6 to IPv6 Mapping"
        required: true

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Echo inputs
        env:
          IPV6_PREFIX: ${{ github.event.inputs.prefix }}
          IPV6_MAPPING: ${{ github.event.inputs.mapping }}
        run: |
          printf '%s\n' "$IPV6_PREFIX"
          printf '%s\n' "$IPV6_MAPPING"
