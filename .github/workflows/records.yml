name: Update DNS records [TEST]

on:
  workflow_dispatch:
    inputs:
      prefix:
        type: string
        description: "IPv6 Prefix"
        required: true
      mapping:
        type: string
        description: "IPv6 to IPv6 Mapping"
        required: true

# workflow_dispatch inputs are attacker-controlled for anyone who can dispatch
# this workflow, including the gateway token. Keep the job token empty and
# pass inputs through the environment so they are not shell-parsed.
permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Echo inputs
        env:
          IPV6_PREFIX: ${{ github.event.inputs.prefix }}
          IPV6_MAPPING: ${{ github.event.inputs.mapping }}
        run: echo "$IPV6_PREFIX and $IPV6_MAPPING"
