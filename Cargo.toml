[package]
name = "ubitix"
version = "1.4.0"
edition = "2024"

[dependencies]
# Async runtime and utilities
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "signal"] }

# CLI argument parsing
clap = { version = "4.6.6", features = ["derive"] }

# Logging facade and simple log backend
log = "0.4.34"
simplelog = "0.12.2"

# Error reporting with rich diagnostics
color-eyre = "0.6.5"

# TOML
toml = "1.1.6+spec-1.1.0"
serde_json = "1.0.151"
serde = "1.0.229"

# Regex processing
regex = "1.13.1"

# GitHub API client
octocrab = "0.54.1"

# File-system notifications (cross-platform)
notify = "8.2.0"

# IP network parsing and utilities
ipnet = { version = "2.12.2", features = ["serde"] }
iptables = "0.6.0"

# Standard OS-specific directories
directories = "6.0.0"
walkdir_minimal = "1.3.0"
